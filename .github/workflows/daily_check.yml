name: Daily Google Flights Price Check

on:
  schedule:
    # Uruchamianie automatyczne (np. codziennie o 09:00 UTC)
    - cron: '0 9 * * *'
  workflow_dispatch: # Pozwala na ręczne uruchomienie w zakładce Actions

# Uprawnienia potrzebne do zapisu w repozytorium oraz publikacji na GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write

# Zapobiega nakładaniu się wielu wdrożeń strony jednocześnie
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kodu
        uses: actions/checkout@v4

      - name: Konfiguracja Pythona
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalacja zależności
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Uruchomienie bota
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          SERPAPI_KEY_2: ${{ secrets.SERPAPI_KEY_2 }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python flight_tracker.py

      - name: Zapis historii cen w repozytorium
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add history.json
          git commit -m "auto: aktualizacja historii cen lotow" || echo "Brak zmian do skomitowania"
          git push

      - name: Przygotowanie plików dla GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Publikacja strony na GitHub Pages
        uses: actions/deploy-pages@v4
